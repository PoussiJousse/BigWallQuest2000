<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" font-family="system-ui,sans-serif" role="img" aria-label="BigWallQuest L7 v0.16 : cordée automatique. L'hôte crée le dépôt privé et la clé, envoie un message ; chaque ami colle le code une fois ; ensuite tout se met à jour à l'ouverture.">
  <rect width="640" height="620" rx="18" fill="#120c24"/>
  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#ffd36b">⚡ Cordée automatique</text>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#b9b0dc">BigWallQuest · L7 v0.16 · 2026-10-20 · sans traceur</text>
  <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#ff7a2f">🔧 HÔTE · 1 fois</text>
  <g font-size="13" fill="#fff">
    <rect x="30" y="110" width="260" height="50" rx="12" fill="#241c42" stroke="#7c70b8"/><text x="46" y="140">① github.com/new → « Cordee » → Privé</text>
    <path d="M160 160v14" stroke="#ff7a2f" stroke-width="3"/><path d="M153 168l7 8 7-8" fill="#ff7a2f"/>
    <rect x="30" y="178" width="260" height="62" rx="12" fill="#241c42" stroke="#7c70b8"/><text x="46" y="202">② Clé « fine-grained » :</text><text x="46" y="224" fill="#d8d2f2">Cordee seulement · Contents R/W</text>
    <path d="M160 240v14" stroke="#ff7a2f" stroke-width="3"/><path d="M153 248l7 8 7-8" fill="#ff7a2f"/>
    <rect x="30" y="258" width="260" height="62" rx="12" fill="#241c42" stroke="#7c70b8"/><text x="46" y="282">③ 🪢 Cordée → 🔧 Je suis l'hôte</text><text x="46" y="304" fill="#d8d2f2">coller la clé → ✔ Tester → prénom</text>
    <path d="M160 320v14" stroke="#ff7a2f" stroke-width="3"/><path d="M153 328l7 8 7-8" fill="#ff7a2f"/>
    <rect x="30" y="338" width="260" height="50" rx="12" fill="#2a2150" stroke="#7dde8a" stroke-width="2"/><text x="46" y="368" font-weight="800" fill="#ffd36b">④ 📤 Inviter un ami (Signal…)</text>
  </g>
  <text x="480" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#ff7a2f">🧗 AMI · 1 fois</text>
  <g font-size="13" fill="#fff">
    <rect x="350" y="110" width="260" height="50" rx="12" fill="#241c42" stroke="#7c70b8"/><text x="366" y="140">① Ouvre le jeu → 🪢 Cordée</text>
    <path d="M480 160v14" stroke="#ff7a2f" stroke-width="3"/><path d="M473 168l7 8 7-8" fill="#ff7a2f"/>
    <rect x="350" y="178" width="260" height="62" rx="12" fill="#241c42" stroke="#7c70b8"/><text x="366" y="202">② Colle tout le message reçu</text><text x="366" y="224" fill="#d8d2f2">→ 📥 Coller le code et activer</text>
    <path d="M480 240v14" stroke="#ff7a2f" stroke-width="3"/><path d="M473 248l7 8 7-8" fill="#ff7a2f"/>
    <rect x="350" y="258" width="260" height="62" rx="12" fill="#2a2150" stroke="#7dde8a" stroke-width="2"/><text x="366" y="282" font-weight="800" fill="#ffd36b">③ Touche ton prénom</text><text x="366" y="304" fill="#d8d2f2">C'est tout ✔</text>
  </g>
  <path d="M290 362 C320 362 330 300 350 290" stroke="#7dde8a" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <rect x="70" y="410" width="500" height="112" rx="14" fill="#1d3a2a" stroke="#7dde8a" stroke-width="2"/>
  <text x="320" y="438" text-anchor="middle" font-size="15" font-weight="800" fill="#7dde8a">🔁 ENSUITE, TOUT SEUL, à chaque ouverture</text>
  <text x="320" y="464" text-anchor="middle" font-size="13" fill="#fff">📱 ouvre l'app ─► 📤 ma carte (si changée) ─► 🗂 Cordee (privé)</text>
  <text x="320" y="488" text-anchor="middle" font-size="13" fill="#fff">🗂 Cordee ─► 📥 cartes des amis ─► 📊 Radars · 📜 Fil · 🪢 Skills</text>
  <text x="320" y="510" text-anchor="middle" font-size="12" fill="#b9b0dc">aussi au retour dans l'app et ~3 s après une séance enregistrée</text>
  <g font-size="12.5" fill="#e8c547" text-anchor="middle">
    <text x="320" y="552">🔑 La clé n'ouvre QUE le dépôt Cordee : le jeu reste intouchable</text>
    <text x="320" y="574">🗓 La clé expire (1 an max) : l'hôte en refait une et renvoie le message</text>
    <text x="320" y="596" fill="#7dde8a">🔒 Clé jamais dans le code ni dans la sauvegarde · seul nouveau site : api.github.com</text>
  </g>
</svg>
