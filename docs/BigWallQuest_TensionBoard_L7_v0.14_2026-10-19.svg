<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="system-ui,sans-serif" role="img" aria-label="BigWallQuest L7 v0.14 : noter un problème Tension Board en 5 étapes">
  <rect width="640" height="560" rx="18" fill="#120c24"/>
  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#ffd36b">🟦 Noter un problème Tension Board</text>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#b9b0dc">BigWallQuest · L7 v0.14 · 2026-10-19 · 100 % local</text>
  <g font-size="15" fill="#fff">
    <rect x="40" y="86" width="560" height="54" rx="12" fill="#241c42" stroke="#7c70b8"/>
    <text x="60" y="119"><tspan font-weight="800" fill="#ff7a2f">1</tspan>  📓 Journal → ＋ (ou séance en cours) → 🪨 Gym bloc</text>
    <path d="M320 140v18" stroke="#ff7a2f" stroke-width="3"/><path d="M313 152l7 8 7-8" fill="#ff7a2f"/>
