<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="system-ui,sans-serif" role="img" aria-label="BigWallQuest L7 v0.15 : la cordée trouve toute seule les cartes grâce à la liste cordee/index.json">
  <rect width="640" height="600" rx="18" fill="#120c24"/>
  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#ffd36b">📬 Voir les progrès de toute la bande</text>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#b9b0dc">BigWallQuest · L7 v0.15 · 2026-10-20 · sans serveur, sans traceur</text>
  <!-- colonne publier -->
  <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#ff7a2f">📤 PUBLIER (moi)</text>
  <g font-size="14" fill="#fff">
    <rect x="30" y="110" width="260" height="62" rx="12" fill="#241c42" stroke="#7c70b8"/>
    <text x="46" y="136">① 🪢 Cordée → 📮 Boîte</text><text x="46" y="158" fill="#d8d2f2">→ 📤 Préparer ma carte</text>
    <path d="M160 172v16" stroke="#ff7a2f" stroke-width="3"/><path d="M153 182l7 8 7-8" fill="#ff7a2f"/>
    <rect x="30" y="192" width="260" height="62" rx="12" fill="#241c42" stroke="#7c70b8"/>
    <text x="46" y="218">🌐 Ouvrir GitHub</text><text x="46" y="240" fill="#d8d2f2">→ Commit changes (vert)</text>
    <path d="M160 254v16" stroke="#ff7a2f" stroke-width="3"/><path d="M153 264l7 8 7-8" fill="#ff7a2f"/>
    <rect x="30" y="274" width="260" height="84" rx="12" fill="#2a2150" stroke="#7dde8a" stroke-width="2"/>
    <text x="46" y="300" font-weight="800" fill="#ffd36b">② bis · 1 seule fois</text>
    <text x="46" y="322" fill="#d8d2f2">📋 Copier la liste → 🌐 Ouvrir</text>
    <text x="46" y="344" fill="#d8d2f2">→ Coller → Commit changes</text>
  </g>
  <!-- dépôt -->
  <rect x="200" y="392" width="240" height="96" rx="14" fill="#1d3a2a" stroke="#7dde8a" stroke-width="2"/>
  <text x="320" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#7dde8a">🗂 Dépôt GitHub · cordee/</text>
  <text x="320" y="442" text-anchor="middle" font-size="13" fill="#fff">📋 index.json = liste des prénoms</text>
  <text x="320" y="464" text-anchor="middle" font-size="13" fill="#fff">🃏 moi.json · ami.json · …</text>
  <text x="320" y="482" text-anchor="middle" font-size="11" fill="#b9b0dc">en ligne ~1 min après</text>
  <path d="M160 358 C160 380 200 400 220 410" stroke="#ff7a2f" stroke-width="3" fill="none"/>
  <!-- colonne lire -->
  <text x="480" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#ff7a2f">🔄 LIRE (les amis)</text>
  <g font-size="14" fill="#fff">
    <rect x="350" y="110" width="260" height="62" rx="12" fill="#241c42" stroke="#7c70b8"/>
    <text x="366" y="136">🪢 Cordée → 📮 Boîte</text><text x="366" y="158" fill="#d8d2f2">→ 🔄 Rafraîchir</text>
    <path d="M480 172v16" stroke="#ff7a2f" stroke-width="3"/><path d="M473 182l7 8 7-8" fill="#ff7a2f"/>
    <rect x="350" y="192" width="260" height="62" rx="12" fill="#241c42" stroke="#7c70b8"/>
    <text x="366" y="218">📋 lit la liste</text><text x="366" y="240" fill="#d8d2f2">→ 🃏 lit chaque carte</text>
    <path d="M480 254v16" stroke="#ff7a2f" stroke-width="3"/><path d="M473 264l7 8 7-8" fill="#ff7a2f"/>
    <rect x="350" y="274" width="260" height="84" rx="12" fill="#241c42" stroke="#7c70b8"/>
    <text x="366" y="300">📊 Radars · 📜 Fil · 🪢 Skills</text>
    <text x="366" y="322" fill="#d8d2f2">de toute la bande</text>
    <text x="366" y="344" fill="#d8d2f2">(8 amis max)</text>
  </g>
  <path d="M420 410 C450 395 480 380 480 358" stroke="#7dde8a" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <g font-size="13" fill="#e8c547">
    <text x="320" y="526" text-anchor="middle">🌐 Cartes publiques : prénom, look, séances. Jamais la sauvegarde ni le Tension Board.</text>
    <text x="320" y="550" text-anchor="middle">📧 GitHub → Settings → Emails → « Keep my email addresses private » ✔</text>
    <text x="320" y="574" text-anchor="middle" fill="#7dde8a">🔒 Le jeu ne contacte que son propre site : aucun autre serveur</text>
  </g>
</svg>
